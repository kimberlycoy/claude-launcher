<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
  // Relative links (manifest, api/) need a trailing slash when served behind /rc.
  if (!location.pathname.endsWith('/')) location.replace(location.pathname + '/' + location.search);
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude Launcher</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Claude">
<style>
  /* Kept from the original theme: warm off-white ground, white cards, terracotta accent.
     --accent-ink is the accent one step darker so text and the one fill pass 4.5:1. */
  :root {
    --bg: #f7f5f2; --card: #fff; --text: #1f1d1a; --muted: #6b655e; --line: #ebe6df; --control: #ddd6cd;
    --accent: #c96442; --accent-ink: #ad4e2d; --accent-fill: #b4532f; --accent-on: #fff;
    --danger: #a8231b; --press: #f1ede8; --pill-bg: #fbe9e1; --pill-ink: #8a3a1f;
  }
  /* Dark: follows the system unless Settings picks Light or Dark (data-theme on <html>). */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1a18; --card: #262422; --text: #eeeae4; --muted: #ada79f; --line: #34312c; --control: #4a463f;
      --accent: #d97757; --accent-ink: #e58a6b; --accent-fill: #d97757; --accent-on: #1b1a18;
      --danger: #f2827a; --press: #2f2c29; --pill-bg: #4a2f24; --pill-ink: #f3b49c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1a18; --card: #262422; --text: #eeeae4; --muted: #ada79f; --line: #34312c; --control: #4a463f;
    --accent: #d97757; --accent-ink: #e58a6b; --accent-fill: #d97757; --accent-on: #1b1a18;
    --danger: #f2827a; --press: #2f2c29; --pill-bg: #4a2f24; --pill-ink: #f3b49c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: env(safe-area-inset-top) 16px calc(88px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 640px; margin: 0 auto; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 24px 0 4px; }
  h1 { font-size: 24px; line-height: 1.2; letter-spacing: -0.01em; margin: 0; }
  #status { color: var(--muted); font-size: 14px; min-height: 20px; margin-bottom: 4px; }
  #status.error { color: var(--danger); }
  #status button { margin-left: 8px; }

  section { margin-top: 28px; }
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 2px 10px; }
  h2 { font-size: 17px; font-weight: 600; margin: 0; }
  h2 .count { color: var(--muted); font-weight: 400; margin-left: 6px; font-variant-numeric: tabular-nums; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  /* Lists read as one list: short rows, separators inset to the text, compact buttons.
     .split is the one full-width line, between running and not running. */
  .row { position: relative; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 12px 6px 16px; }
  .row + .row::before { content: ''; position: absolute; top: 0; left: 16px; right: 0; border-top: 1px solid var(--line); }
  /* On a group page running projects get their own card above the rest. */
  .card + .card { margin-top: 10px; }
  .row button, .row a.btn { min-height: 34px; padding: 0 12px; font-size: 14px; }
  .name { flex: 1; min-width: 0; font-weight: 600; overflow-wrap: break-word; }
  .meta { display: block; color: var(--muted); font-size: 13px; font-weight: 400; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .server .line { display: flex; align-items: center; min-width: 0; }
  .server .label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .server { gap: 8px; }
  /* A server waiting for Trust is the one row that needs you: a pale pill beside its name. */
  .pill {
    flex: none; white-space: nowrap; margin-left: 8px;
    padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; line-height: 16px;
    background: var(--pill-bg); color: var(--pill-ink);
  }

  /* One control shape: a 40px rounded rectangle, outlined. Trust, which is rare, is the only fill. */
  button, a.btn {
    font: inherit; font-size: 15px; font-weight: 500; line-height: 1; min-height: 40px; padding: 0 16px;
    display: inline-flex; align-items: center; justify-content: center; flex: none;
    border: 1px solid var(--control); border-radius: 8px; background: transparent; color: var(--text);
    cursor: pointer; text-decoration: none; white-space: nowrap;
    transition: background-color .12s, transform .08s;
  }
  button:active:not(:disabled), a.btn:active { transform: scale(.97); background: var(--press); }
  @media (hover: hover) { button:hover:not(:disabled), a.btn:hover { background: var(--press); } }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .5; cursor: default; }
  .start, a.btn { color: var(--accent-ink); }
  .fill { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--accent-on); font-weight: 600; }
  .fill:active:not(:disabled) { background: var(--accent-fill); filter: brightness(.92); }
  @media (hover: hover) { .fill:hover:not(:disabled) { background: var(--accent-fill); filter: brightness(.95); } }
  .stop { color: var(--danger); }
  .link { border: 0; min-height: 32px; padding: 0 4px; color: var(--accent-ink); font-size: 15px; }

  /* Folded lists: three rows, then a down arrow with the number hidden. */
  .down { width: 100%; border: 0; border-top: 1px solid var(--line); border-radius: 0; min-height: 44px; color: var(--accent-ink); white-space: pre; }
  .create input {
    flex: 1; min-width: 0; height: 36px; font: inherit; font-size: 16px; padding: 0 14px;
    border: 1px solid var(--control); border-radius: 8px; background: var(--bg); color: var(--text);
  }
  .create input::placeholder { color: var(--muted); opacity: 1; }
  .create input:focus-visible { outline-offset: 0; }
  .hint { padding: 0 16px 10px; margin: 0; }
  .loading, .empty { color: var(--muted); padding: 18px 16px; }
  .empty { font-size: 15px; }

  /* Home: each group has a Running and a Recent list under its name. */
  .group + .group { margin-top: 36px; }
  .group > .head a { color: var(--accent-ink); text-decoration: none; font-size: 15px; font-weight: 500; }
  h3 { font-size: 14px; font-weight: 500; color: var(--muted); margin: 14px 2px 8px; }

  /* Settings: one row per setting, the control on the right. */
  .setting { justify-content: space-between; }
  .setting .name { font-weight: 500; }
  .stepper { display: flex; align-items: center; gap: 4px; flex: none; }
  .stepper button { width: 40px; padding: 0; font-size: 20px; }
  .stepper output { min-width: 32px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }
  .segments { display: flex; flex: none; border: 1px solid var(--control); border-radius: 8px; overflow: hidden; }
  .segments button { border: 0; border-radius: 0; min-height: 36px; padding: 0 12px; font-size: 14px; }
  .segments button + button { border-left: 1px solid var(--control); }
  .segments [aria-pressed="true"] { background: var(--press); font-weight: 600; }
  /* Account switch on Home, shown only with more than one account. */
  .account { margin: 12px 0 28px; }
  .account .segments { display: flex; }
  .account .segments button { flex: 1; min-height: 40px; font-size: 15px; }
  .account .count { margin-left: 6px; font-weight: 400; color: var(--accent-ink); font-variant-numeric: tabular-nums; }
  .who { color: var(--muted); font-size: 13px; margin: 6px 2px 0; overflow-wrap: anywhere; }
  .who.out { color: var(--danger); }
  .who code { font-size: 12px; }

  /* Bottom toolbar: Home, one tab per group, Settings. */
  nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 2;
    display: flex; justify-content: center; background: var(--card); border-top: 1px solid var(--line);
    padding: 0 8px env(safe-area-inset-bottom);
  }
  /* Each tab is an icon over a short label, like an iOS tab bar. */
  nav a {
    flex: 1; max-width: 160px; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; padding: 6px 4px 4px; text-align: center; font-size: 11px; font-weight: 500; line-height: 1.2;
    color: var(--muted); text-decoration: none;
  }
  nav svg { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  nav span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  nav a[aria-current="page"] { color: var(--accent-ink); font-weight: 600; }
  nav a[aria-current="page"] svg { stroke-width: 2.25; }
  nav a:active { background: var(--press); }
  /* Pull to refresh: iOS home-screen apps have no built-in one. */
  html, body { overscroll-behavior-y: none; }
  #ptr {
    position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 8px); text-align: center;
    color: var(--muted); font-size: 14px; opacity: 0; pointer-events: none;
  }
  main.settle { transition: transform .2s; }
  @media (prefers-reduced-motion: reduce) { button, a.btn { transition: none; } button:active, a.btn:active { transform: none; } }
</style>
</head>
<body>
<div id="ptr" aria-hidden="true"></div>
<main>
  <header><h1 id="title">Claude Launcher</h1></header>
  <div id="status" role="status"></div>
  <div id="view"><div class="card loading">Loading projects…</div></div>
</main>
<nav id="tabs" aria-label="Pages"></nav>
<script>
  const base = location.pathname;
  const $view = document.getElementById('view');
  const $title = document.getElementById('title');
  const $tabs = document.getElementById('tabs');
  const $status = document.getElementById('status');
  let busy = false;
  let state = null; // last /api/state, so switching pages renders at once

  // Settings live in this browser only.
  const DEFAULTS = { rows: 3, recentDays: 7, recentCount: 5, theme: 'system' };
  const settings = { ...DEFAULTS, ...JSON.parse(localStorage.getItem('settings') || '{}') };
  function saveSettings() {
    localStorage.setItem('settings', JSON.stringify(settings));
    applyTheme();
  }
  function applyTheme() {
    if (settings.theme === 'system') delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = settings.theme;
  }
  applyTheme();

  // With more than one Claude account, the page shows one at a time: its groups in the
  // toolbar and on Home. The choice is kept apart from settings so Reset doesn't switch it.
  let account = localStorage.getItem('account');
  const mine = () => state.groups.filter((g) => g.account === account);

  function setStatus(text, isError) {
    $status.textContent = text || '';
    $status.className = isError ? 'error' : '';
  }

  async function api(path, body) {
    const res = await fetch(base + 'api/' + path, body ? {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    } : {});
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    return data;
  }

  function age(ms) {
    const m = Math.round((Date.now() - ms) / 60000);
    if (m < 1) return 'just started';
    if (m < 60) return `${m} min`;
    const h = Math.floor(m / 60);
    return h < 24 ? `${h} hr ${m % 60} min` : `${Math.floor(h / 24)} d ${h % 24} hr`;
  }

  function ago(ms) {
    const m = Math.round((Date.now() - ms) / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return `${m} min ago`;
    const h = Math.round(m / 60);
    if (h < 24) return `${h} hr ago`;
    const d = Math.round(h / 24);
    return d === 1 ? 'yesterday' : `${d} days ago`;
  }

  function el(tag, attrs = {}, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else if (v != null && v !== false) e.setAttribute(k, v);
    }
    e.append(...kids);
    return e;
  }

  // Pages: #/ is Home, #/<group> a group's page, #/settings Settings.
  const slug = (g) => g.short.toLowerCase().replace(/[^a-z0-9]+/g, '-');
  const route = () => decodeURIComponent(location.hash.replace(/^#\/?/, ''));

  function render() {
    if (!state) return;
    if (!state.accounts.some((a) => a.id === account)) account = state.accounts[0].id;
    const r = route();
    const group = mine().find((g) => slug(g) === r);
    const page = r === 'settings' ? 'settings' : group ? 'group' : 'home';
    $tabs.replaceChildren(
      tab('#/', 'Home', 'home', page === 'home'),
      ...mine().map((g) => tab('#/' + slug(g), g.short, 'folder', group === g)),
      tab('#/settings', 'Settings', 'gear', page === 'settings'));
    if (page === 'settings') { $title.textContent = 'Settings'; $view.replaceChildren(...settingsPage()); }
    else if (group) { $title.textContent = group.title; $view.replaceChildren(...groupPage(group)); }
    else { $title.textContent = 'Claude Launcher'; $view.replaceChildren(...homePage()); }
  }

  // Toolbar icons: 24px outline paths (Lucide shapes), drawn in the tab's text color.
  const ICONS = {
    home: ['M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8',
      'M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z'],
    folder: ['M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z'],
    gear: ['M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z',
      'M15 12a3 3 0 1 1-6 0a3 3 0 1 1 6 0'],
  };
  function icon(name) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 24 24'); svg.setAttribute('aria-hidden', 'true');
    for (const d of ICONS[name]) {
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', d); svg.append(path);
    }
    return svg;
  }
  const tab = (href, label, name, current) =>
    el('a', { href, 'aria-current': current ? 'page' : null }, icon(name), el('span', {}, label));

  // Servers waiting for Trust first, then by name.
  const byTrustThenName = (a, b) => (b.server.trustPrompt - a.server.trustPrompt) || a.name.localeCompare(b.name);

  function homePage() {
    const cutoff = Date.now() - settings.recentDays * 864e5;
    return [...accountSwitch(), ...mine().map((g) => {
      const running = g.projects.filter((p) => p.server).sort(byTrustThenName);
      const recent = g.projects.filter((p) => !p.server && p.changed && p.changed >= cutoff)
        .sort((a, b) => b.changed - a.changed).slice(0, settings.recentCount);
      const kids = [el('div', { class: 'head' }, el('h2', {}, g.title),
        el('a', { href: '#/' + slug(g) }, `All ${g.projects.length} ›`))];
      if (running.length) kids.push(el('h3', {}, 'Running'),
        el('div', { class: 'card' }, ...fold(g.title + ':running', running.map(project), trustHidden(running))));
      if (recent.length) kids.push(el('h3', {}, 'Recent'),
        el('div', { class: 'card' }, ...fold(g.title + ':recent', recent.map(project))));
      if (!running.length && !recent.length) kids.push(el('div', { class: 'card empty' },
        `Nothing running or changed in the last ${settings.recentDays === 1 ? 'day' : settings.recentDays + ' days'}.`));
      return el('section', { class: 'group' }, ...kids);
    })];
  }

  // Each tab counts the account's running servers; below is who it's signed in as.
  function accountSwitch() {
    if (state.accounts.length < 2) return [];
    const running = (id) => state.groups.filter((g) => g.account === id)
      .reduce((n, g) => n + g.projects.filter((p) => p.server).length, 0);
    const pick = (id) => { account = id; localStorage.setItem('account', id); setStatus(''); render(); };
    const a = state.accounts.find((x) => x.id === account);
    return [el('div', { class: 'account' },
      el('div', { class: 'segments', role: 'group', 'aria-label': 'Account' }, ...state.accounts.map((x) => {
        const n = running(x.id);
        return el('button', { 'aria-pressed': String(x.id === account), onclick: () => pick(x.id) },
          x.title, n ? el('span', { class: 'count', 'aria-label': `, ${n} running` }, String(n)) : '');
      })),
      a.loggedIn
        ? el('div', { class: 'who' }, [a.email, a.org].filter(Boolean).join(' · '))
        : el('div', { class: 'who out' }, 'Not signed in. On the Mac, run ',
          el('code', {}, `${a.configDir ? `CLAUDE_CONFIG_DIR=${a.configDir} ` : ''}claude auth login`)))];
  }

  function groupPage(g) {
    const running = g.projects.filter((p) => p.server).sort(byTrustThenName);
    const idle = g.projects.filter((p) => !p.server);
    // Running in one card, the rest by name in a second, under one heading. No folding on this page.
    return [
      section(el('div', { class: 'card' }, createRow(g))),
      section(head('Projects', g.projects.length),
        running.length ? el('div', { class: 'card' }, ...running.map(project)) : '',
        idle.length ? el('div', { class: 'card' }, ...idle.map(project)) : ''),
    ];
  }

  function settingsPage() {
    const set = (k, v) => { settings[k] = v; saveSettings(); render(); };
    const stepper = (k, min, max) => el('div', { class: 'stepper' },
      el('button', { 'aria-label': 'Fewer', disabled: settings[k] <= min, onclick: () => set(k, settings[k] - 1) }, '−'),
      el('output', {}, String(settings[k])),
      el('button', { 'aria-label': 'More', disabled: settings[k] >= max, onclick: () => set(k, settings[k] + 1) }, '+'));
    const row = (label, detail, control) => el('div', { class: 'row setting' },
      el('div', { class: 'name' }, label, el('span', { class: 'meta' }, detail)), control);
    return [
      section(head('Lists'), el('div', { class: 'card' },
        row('Rows before the arrow', 'Longer lists fold after this many', stepper('rows', 1, 20)))),
      section(head('Recent'), el('div', { class: 'card' },
        row('Days to look back', 'A project is recent if a file changed in this time', stepper('recentDays', 1, 60)),
        row('Projects per group', 'On Home, under each group', stepper('recentCount', 1, 20)))),
      section(head('Appearance'), el('div', { class: 'card' },
        row('Theme', 'System follows your iPhone', el('div', { class: 'segments' },
          ...['system', 'light', 'dark'].map((t) => el('button', { 'aria-pressed': String(settings.theme === t), onclick: () => set('theme', t) },
            t[0].toUpperCase() + t.slice(1))))))),
      section(el('div', { class: 'card' }, row('Reset settings', 'Back to the defaults',
        el('button', { onclick: () => { Object.assign(settings, DEFAULTS); saveSettings(); render(); } }, 'Reset')))),
    ];
  }

  const section = (...kids) => el('section', {}, ...kids);

  function head(title, count) {
    return el('div', { class: 'head' },
      el('h2', {}, title, count == null ? '' : el('span', { class: 'count' }, String(count))));
  }

  // A server waiting for Trust past the fold keeps its list open, so its button shows.
  const trustHidden = (running) => running.slice(settings.rows).some((p) => p.server.trustPrompt);

  // Lists show settings.rows rows, then a down arrow with the number of rows hidden.
  // Open lists are remembered by key across refreshes.
  const unfolded = {};
  function fold(key, rows, forceOpen = false) {
    const n = settings.rows;
    if (rows.length <= n || forceOpen) return rows;
    const open = !!unfolded[key];
    return [...(open ? rows : rows.slice(0, n)),
      el('button', { class: 'down', 'aria-expanded': String(open), onclick: () => { unfolded[key] = !open; render(); } },
        open ? '⌃  Show fewer' : `⌄  ${rows.length - n} more`)];
  }

  function project(p) {
    const s = p.server;
    if (!s) return el('div', { class: 'row' },
      el('div', { class: 'name' }, p.name, p.changed ? el('span', { class: 'meta' }, 'Changed ' + ago(p.changed)) : ''),
      el('button', { class: 'start', disabled: busy, onclick: () => start(p) }, 'Start'));
    const n = s.sessions;
    const detail = s.trustPrompt ? 'Waiting to trust this folder'
      : [n == null ? '' : n === 1 ? '1 session' : `${n} sessions`, age(s.started)].filter(Boolean).join(' · ');
    return el('div', { class: 'row server' },
      el('div', { class: 'name' },
        el('span', { class: 'line' }, el('span', { class: 'label' }, p.name),
          s.trustPrompt ? el('span', { class: 'pill' }, 'Needs you') : ''),
        el('span', { class: 'meta' }, detail)),
      s.trustPrompt ? el('button', { class: 'fill', disabled: busy, onclick: () => trust(p) }, 'Trust') : '',
      s.url ? el('a', { class: 'btn', href: s.url, target: '_blank' }, 'Open') : '',
      el('button', { class: 'stop', disabled: busy, onclick: () => stop(p) }, 'Stop'));
  }

  // Refreshes rebuild the page, so keep typed names across renders.
  const drafts = {};

  // "My New App!" becomes "my-new-app": the server only accepts letters, numbers, . _ and -.
  const folderName = (s) => s.trim().toLowerCase()
    .normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9._-]+/g, '-').replace(/-{2,}/g, '-')
    .replace(/^[^a-z0-9]+|[-.]+$/g, '').slice(0, 64);

  function createRow(g) {
    const name = drafts[g.title] || '';
    const fixed = folderName(name);
    const hint = name.trim() && fixed !== name.trim() ? el('span', { class: 'meta hint' }, fixed ? `Will be ${fixed}` : 'Use some letters or numbers') : '';
    const row = el('div', { class: 'row create' },
      el('input', {
        placeholder: 'New project', 'aria-label': `New project in ${g.title}`,
        autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false',
        enterkeyhint: 'go', disabled: busy, value: drafts[g.title] || null,
        oninput: (e) => { drafts[g.title] = e.target.value; showHint(e.target, g); },
        onkeydown: (e) => { if (e.key === 'Enter') create(g); },
      }),
      el('button', { class: 'start', disabled: busy, onclick: () => create(g) }, 'Create'));
    return hint ? el('div', {}, row, hint) : row;
  }

  // Update just the hint while typing, so the input keeps focus.
  function showHint(input, g) {
    const name = input.value.trim(), fixed = folderName(name);
    const card = input.closest('.card');
    card.querySelector('.hint')?.remove();
    if (name && fixed !== name) card.append(el('span', { class: 'meta hint' }, fixed ? `Will be ${fixed}` : 'Use some letters or numbers'));
  }

  async function create(g) {
    const name = folderName(drafts[g.title] || '');
    if (!name || busy) return;
    busy = true; setStatus(`Creating ${name} and starting Remote Control...`); render();
    try {
      const r = await api('create', { group: g.title, name });
      delete drafts[g.title];
      setStatus(r.trustPrompt ? `Created ${r.name}. Tap Trust to let Claude work in it.`
        : `Started ${r.name}. Its session should appear in the Claude app shortly.`);
    } catch (e) { setStatus('Create failed: ' + e.message, true); }
    busy = false; refresh();
  }

  async function refresh() {
    try {
      state = await api('state');
      // Rebuilding the page while typing would close the iPhone keyboard.
      if (!document.activeElement?.closest('.create')) render();
      if (!busy) setStatus('');
    } catch (e) {
      setStatus(`Couldn't load projects (${e.message}).`, true);
      $status.append(el('button', { class: 'link', onclick: refresh }, 'Retry'));
    }
  }

  async function start(p) {
    busy = true; setStatus(`Starting Remote Control in ${p.name}...`); render();
    try {
      const r = await api('start', { path: p.path });
      setStatus(r.trustPrompt ? `${r.name} is waiting for you to trust its folder.`
        : `Started ${r.name}. Its session should appear in the Claude app shortly.`);
    } catch (e) { setStatus('Start failed: ' + e.message, true); }
    busy = false; refresh();
  }

  async function trust(p) {
    if (!confirm(`Trust ${p.path}? Sessions there can read, edit and run files, and the folder's project settings apply to them.`)) return;
    busy = true; setStatus(`Trusting ${p.name}...`); render();
    try { await api('trust', { id: p.server.id }); setStatus(`Trusted ${p.name}. Its session should appear in the Claude app shortly.`); }
    catch (e) { setStatus('Trust failed: ' + e.message, true); }
    busy = false; refresh();
  }

  async function stop(p) {
    const n = p.server.sessions;
    if (!confirm(`Stop Remote Control in ${p.name}?` + (n ? ` Its ${n === 1 ? 'session' : n + ' sessions'} will end.` : ''))) return;
    busy = true; setStatus(`Stopping ${p.name}...`); render();
    try { await api('stop', { id: p.server.id }); setStatus(`Stopped ${p.name}.`); }
    catch (e) { setStatus('Stop failed: ' + e.message, true); }
    busy = false; refresh();
  }

  // Pull down from the top and let go past the threshold to reload the page.
  (() => {
    const $main = document.querySelector('main');
    const $ptr = document.getElementById('ptr');
    const THRESHOLD = 70;
    let y0 = null, pull = 0;
    const show = (d) => {
      $main.style.transform = d ? `translateY(${d}px)` : '';
      $ptr.style.opacity = Math.min(1, d / THRESHOLD);
      $ptr.textContent = d >= THRESHOLD ? 'Release to reload' : 'Pull to reload';
    };
    addEventListener('touchstart', (e) => {
      y0 = scrollY <= 0 && e.touches.length === 1 && !e.target.closest('input, nav') ? e.touches[0].clientY : null;
      pull = 0; $main.classList.remove('settle');
    }, { passive: true });
    addEventListener('touchmove', (e) => {
      if (y0 == null) return;
      const dy = e.touches[0].clientY - y0;
      if (dy <= 0 || scrollY > 0) { if (pull) show(pull = 0); return; }
      e.preventDefault(); // keep the page still while pulling
      pull = Math.min(110, dy * 0.5);
      show(pull);
    }, { passive: false });
    addEventListener('touchend', () => {
      if (y0 == null) return;
      y0 = null;
      $main.classList.add('settle');
      if (pull >= THRESHOLD) { $ptr.textContent = 'Reloading…'; location.reload(); return; }
      show(pull = 0);
    });
  })();

  addEventListener('hashchange', () => { scrollTo(0, 0); render(); });
  refresh();
  // Only Home refreshes on its own; other pages use pull to reload.
  setInterval(() => { if (!route() && !document.hidden) refresh(); }, 15000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
  // Relative links (manifest, api/) need a trailing slash when served behind /rc.
  if (!location.pathname.endsWith('/')) location.replace(location.pathname + '/' + location.search);
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude Launcher</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Claude">
<style>
  :root {
    --bg: #f7f5f2; --card: #fff; --text: #1f1d1a; --muted: #77716a; --line: #e6e1da;
    --accent: #c96442; --accent-text: #fff; --danger: #b3261e; --ok: #2e7d4f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1a18; --card: #262422; --text: #eeeae4; --muted: #a39d95; --line: #38352f;
      --accent: #d97757; --accent-text: #1b1a18; --danger: #f2827a; --ok: #5cc28a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom));
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 20px 0 4px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 24px 0 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .project { border-top: 1px solid var(--line); }
  .project:first-child { border-top: 0; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
  .name { flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
  button:disabled { opacity: .5; }
  button, a.btn {
    font: inherit; font-size: 14px; border: 0; border-radius: 8px; padding: 7px 12px;
    cursor: pointer; text-decoration: none; white-space: nowrap;
  }
  .new { background: var(--accent); color: var(--accent-text); font-weight: 600; }
  .age { color: var(--muted); font-size: 12px; font-weight: 400; display: block; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 8px; vertical-align: 1px; }
  .running { border-color: var(--ok); }
  a.btn { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  .stop { background: transparent; color: var(--danger); border: 1px solid var(--line); }
  .create input {
    flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 6px 10px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text);
  }
  .peek {
    width: 100%; text-align: left; background: transparent; color: var(--text);
    border-radius: 0; padding: 12px 14px; font-size: 16px;
  }
  .peek .chev { color: var(--accent); font-size: 20px; line-height: 1; }
  .more {
    width: 100%; background: transparent; color: var(--accent); border-radius: 0;
    border-top: 1px solid var(--line); padding: 11px 14px; text-align: left;
  }
  h2 button {
    font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit;
    background: none; border: 0; padding: 0; border-radius: 0;
  }
  h2 button::before { content: '\25B8'; display: inline-block; width: 1.2em; transition: transform .15s; }
  h2 button[aria-expanded="true"]::before { transform: rotate(90deg); }
  .create button { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  #status { color: var(--muted); font-size: 14px; min-height: 20px; }
  .error { color: var(--danger) !important; }
</style>
</head>
<body>
<main>
  <h1>Claude Launcher</h1>
  <div id="status"></div>
  <div id="groups"></div>
</main>
<script>
  const base = location.pathname;
  const $groups = document.getElementById('groups');
  const $status = document.getElementById('status');
  let busy = false;

  function setStatus(text, isError) {
    $status.textContent = text || '';
    $status.className = isError ? 'error' : '';
  }

  async function api(path, body) {
    const res = await fetch(base + 'api/' + path, body ? {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    } : {});
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    return data;
  }

  function age(ms) {
    const m = Math.round((Date.now() - ms) / 60000);
    if (m < 60) return `${m} min`;
    const h = Math.floor(m / 60);
    return h < 24 ? `${h} hr ${m % 60} min` : `${Math.floor(h / 24)} d ${h % 24} hr`;
  }

  function el(tag, attrs = {}, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else if (v != null && v !== false) e.setAttribute(k, v);
    }
    e.append(...kids);
    return e;
  }

  // Running projects go in their own section at the top; the groups below list the rest.
  function render({ groups }) {
    const running = groups.flatMap((g) => g.projects.filter((p) => p.server).map((p) => ({ ...p, group: g.title })))
      .sort((a, b) => a.name.localeCompare(b.name));
    const sections = [el('section', {},
      toggle('New project', createOpen, () => { createOpen = !createOpen; }),
      el('div', { class: 'card' }, ...(createOpen ? groups.map(createRow) : [createPeek(groups)])))];
    // More than three running servers collapse, unless one is waiting for Trust.
    const collapsible = running.length > 3 && !running.some((p) => p.server.trustPrompt);
    const showRunning = !collapsible || runningOpen;
    if (running.length) sections.push(el('section', {},
      collapsible ? toggle(`Running · ${running.length}`, runningOpen, () => { runningOpen = !runningOpen; })
        : el('h2', {}, `Running · ${running.length}`),
      showRunning ? el('div', { class: 'card running' }, ...running.map(project)) : ''));
    for (const g of groups) {
      const idle = g.projects.filter((p) => !p.server);
      if (idle.length) sections.push(el('section', {},
        el('h2', {}, g.title),
        el('div', { class: 'card' }, ...firstRows(g.title, idle.map(project)))));
    }
    $groups.replaceChildren(...sections);
  }

  function project(p) {
    const s = p.server;
    if (!s) return el('div', { class: 'project row' },
      el('div', { class: 'name' }, p.name),
      el('button', { class: 'new', disabled: busy, onclick: () => start(p) }, 'Start'));
    const n = s.sessions;
    const detail = [p.group, 'running ' + age(s.started),
      n == null ? '' : n === 1 ? '1 session' : `${n} sessions`].filter(Boolean).join(' · ');
    return el('div', { class: 'project row' },
      el('div', { class: 'name' }, el('span', { class: 'dot' }), p.name,
        el('span', { class: 'age' }, s.trustPrompt ? 'Waiting for you to trust this folder' : detail)),
      s.trustPrompt ? el('button', { class: 'new', disabled: busy, onclick: () => trust(p) }, 'Trust') : '',
      s.url ? el('a', { class: 'btn', href: s.url, target: '_blank' }, 'Open') : '',
      el('button', { class: 'stop', disabled: busy, onclick: () => stop(p) }, 'Stop'));
  }

  // The 15-second refresh rebuilds the page, so keep typed names across renders.
  const drafts = {};
  let createOpen = false; // New project starts closed on every load
  let runningOpen = false;

  // Group lists show three projects until opened.
  const groupOpen = {};
  function firstRows(key, rows) {
    if (rows.length <= 3) return rows;
    const open = groupOpen[key];
    return [...(open ? rows : rows.slice(0, 3)),
      el('button', { class: 'more', 'aria-expanded': String(!!open), onclick: () => { groupOpen[key] = !open; refresh(); } },
        open ? 'Show fewer' : `Show ${rows.length - 3} more`)];
  }

  function toggle(label, open, flip) {
    return el('h2', {}, el('button', { 'aria-expanded': String(open), onclick: () => { flip(); refresh(); } }, label));
  }

  // Closed state: a tappable card that says what's inside.
  function createPeek(groups) {
    return el('button', { class: 'peek row', onclick: () => { createOpen = true; refresh(); } },
      el('div', { class: 'name' }, 'Make a folder and start Claude in it',
        el('span', { class: 'age' }, groups.map((g) => g.title).join(' · '))),
      el('span', { class: 'chev', 'aria-hidden': 'true' }, '\u203A'));
  }

  function createRow(g) {
    return el('div', { class: 'project row create' },
      el('input', {
        placeholder: g.title, 'aria-label': `New project in ${g.title}`,
        autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false',
        enterkeyhint: 'go', disabled: busy, value: drafts[g.title] || null,
        oninput: (e) => { drafts[g.title] = e.target.value; },
        onkeydown: (e) => { if (e.key === 'Enter') create(g); },
      }),
      el('button', { disabled: busy, onclick: () => create(g) }, 'Create'));
  }

  async function create(g) {
    const name = (drafts[g.title] || '').trim();
    if (!name || busy) return;
    busy = true; setStatus(`Creating ${name} and starting Remote Control...`); refresh();
    try {
      const r = await api('create', { group: g.title, name });
      delete drafts[g.title];
      setStatus(r.trustPrompt ? `Created ${r.name}. Tap Trust to let Claude work in it.`
        : `Started ${r.name}. Its session should appear in the Claude app shortly.`);
    } catch (e) { setStatus('Create failed: ' + e.message, true); }
    busy = false; refresh();
  }

  async function refresh() {
    try {
      const state = await api('state');
      // Rebuilding the page while typing would close the iPhone keyboard.
      if (!document.activeElement?.closest('.create')) render(state);
      if (!busy) setStatus('');
    }
    catch (e) { setStatus('Could not load: ' + e.message, true); }
  }

  async function start(p) {
    busy = true; setStatus(`Starting Remote Control in ${p.name}...`); refresh();
    try {
      const r = await api('start', { path: p.path });
      setStatus(r.trustPrompt ? `${r.name} is waiting for you to trust its folder.`
        : `Started ${r.name}. Its session should appear in the Claude app shortly.`);
    } catch (e) { setStatus('Start failed: ' + e.message, true); }
    busy = false; refresh();
  }

  async function trust(p) {
    if (!confirm(`Trust ${p.path}? Sessions there can read, edit and run files, and the folder's project settings apply to them.`)) return;
    busy = true; setStatus(`Trusting ${p.name}...`); refresh();
    try { await api('trust', { id: p.server.id }); setStatus(`Trusted ${p.name}. Its session should appear in the Claude app shortly.`); }
    catch (e) { setStatus('Trust failed: ' + e.message, true); }
    busy = false; refresh();
  }

  async function stop(p) {
    const n = p.server.sessions;
    if (!confirm(`Stop Remote Control in ${p.name}?` + (n ? ` Its ${n === 1 ? 'session' : n + ' sessions'} will end.` : ''))) return;
    busy = true; setStatus(`Stopping ${p.name}...`); refresh();
    try { await api('stop', { id: p.server.id }); setStatus(`Stopped ${p.name}.`); }
    catch (e) { setStatus('Stop failed: ' + e.message, true); }
    busy = false; refresh();
  }

  refresh();
  setInterval(refresh, 15000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
